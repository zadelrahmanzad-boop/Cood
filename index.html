<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>EH License Generator</title>

<style>
body{
    font-family:Tahoma;
    background:#f3f5f7;
    padding:40px;
}
.box{
    max-width:500px;
    margin:auto;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}
h2{text-align:center;}
label{display:block;margin-top:15px;font-weight:bold;}
input,textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
}
textarea{height:120px;}
button{
    width:100%;
    margin-top:20px;
    padding:12px;
    background:#0078d7;
    color:#fff;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
button:hover{background:#005ea6;}
</style>
</head>

<body>

<div class="box">

<h2>مولد أكواد التفعيل</h2>

<label>Device Code</label>
<input type="text" id="txtDeviceCode">

<label>عدد الأيام</label>
<input type="number" id="txtDays">

<button onclick="generateCode()">توليد الكود</button>

<label>كود التفعيل</label>
<textarea id="txtCode" readonly></textarea>

</div>

<script>

const SECRET_KEY = "EH_LOCK_2026";

function makeSign(txt){
    let s = 0;
    for(let i=0;i<txt.length;i++){
        s += txt.charCodeAt(i);
        s = s % 100000000;
    }
    return String(s).padStart(8,'0');
}

function encrypt(txt){

    let result = "";

    for(let i=0;i<txt.length;i++){

        // ✅ FIXED (مطابق لـ Access)
        let k = (i % SECRET_KEY.length);

        let ch = txt.charCodeAt(i) ^
                 SECRET_KEY.charCodeAt(k);

        result += ch.toString(16)
                    .toUpperCase()
                    .padStart(2,'0');
    }

    return result;
}

function formatDate(){
    let d = new Date();
    return String(d.getDate()).padStart(2,'0') +
           String(d.getMonth()+1).padStart(2,'0') +
           d.getFullYear();
}

function randomHex(){
    return Math.floor(Math.random()*65535)
           .toString(16)
           .toUpperCase()
           .padStart(4,'0');
}

function generateCode(){

    let deviceID = document.getElementById("txtDeviceCode").value.trim();
    let daysCount = parseInt(document.getElementById("txtDays").value);

    if(deviceID === ""){
        alert("ادخل Device Code");
        return;
    }

    if(!daysCount || daysCount <= 0){
        alert("عدد الأيام غير صحيح");
        return;
    }

    let raw =
        "EH|" +
        deviceID + "|" +
        formatDate() + "|" +
        daysCount + "|" +
        randomHex() + "|LOCK";

    let sign = makeSign(raw + SECRET_KEY);

    let finalCode = encrypt(raw + "|" + sign);

    let box = document.getElementById("txtCode");
    box.value = finalCode;

    box.select();
    document.execCommand("copy");

    alert("تم نسخ الكود");
}

</script>

</body>
</html>
